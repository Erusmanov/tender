services:
  - type: web
    name: tenderhub-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ROSTENDER_EMAIL
        sync: false
      - key: ROSTENDER_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
